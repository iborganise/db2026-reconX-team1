# TICKET-ADV147 — Frontend nginx SPA fallback and backend API proxy
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # ============================================================
    # TICKET-ADV147 — SPA fallback for React Router
    # Any frontend route should return index.html
    # Example: /trades, /dashboard
    # ============================================================
    location / {

        try_files $uri $uri/ /index.html;

    }


    # ============================================================
    # TICKET-ADV147 — Backend API proxy
    # Browser calls /api/...
    # nginx forwards to backend container
    # ============================================================
    location /api/ {

        proxy_pass http://backend:8080/api/;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        # SSE support
        proxy_buffering off;

        proxy_cache off;

        chunked_transfer_encoding off;

        proxy_read_timeout 1h;
    }
}